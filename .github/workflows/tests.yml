
name: Tests

on:
  pull_request:
    branches:
      - development
  push:
    branches:
      - development

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Python 3.10)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest==9.2.0"

      - name: Run tests
        run: python -m pytest -v

